# Shared security headers for the portfolio vhost.
#
# Mirrors SECURITY_HEADERS in worker.js. Kept in a snippet because nginx does
# not inherit add_header directives inside a location block that defines its
# own add_header (the cache-control locations below need this include).
#
# Install to /etc/nginx/snippets/portfolio-security-headers.conf

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none';" always;
