# dream-team.works - static origin for the portfolio.
#
# Cloudflare proxies the site and cloudflared tunnels traffic to this vhost,
# so TLS terminates at the edge and this server block only needs plain HTTP on
# localhost/LAN. If you later add direct HTTPS, add a 443 server block with a
# Cloudflare Origin Certificate.
#
# Install (copy these files to the server first, then):
#   sudo cp security-headers.conf /etc/nginx/snippets/portfolio-security-headers.conf
#   sudo cp dream-team.works.conf  /etc/nginx/sites-available/dream-team.works.conf
#   sudo ln -s /etc/nginx/sites-available/dream-team.works.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Details: server/README.md
#
# Cache policy intentionally avoids "immutable" for css/js because the filenames
# are not content-hashed: a deploy must be able to replace them for returning
# visitors. (worker.js still uses immutable - align it if stale assets bite.)

server {
    listen 80;
    listen [::]:80;
    server_name dream-team.works www.dream-team.works;

    root /var/www/dream-team.works;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # HTML: always revalidate.
    location = /index.html {
        include snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # CSS/JS: revalidate; ETags keep repeat visits cheap.
    location ~* \.(css|js)$ {
        include snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }

    # Images and media change rarely; a day of caching is safe.
    location ~* \.(jpg|jpeg|png|gif|svg|ico|webp|avif|mp4|webm|woff2?)$ {
        include snippets/portfolio-security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # Unknown paths fall back to the landing page (same behavior as the Worker).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
